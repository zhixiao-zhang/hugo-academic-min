- arxiv_id: 2510.01072v3
  title: "Lessons Learned So Far From a Community Effort to Verify the Rust\n  Standard\
    \ Library (work-in-progress)"
  authors:
  - Alex Le Blanc
  - Patrick Lam
  summary: "Although Rust primarily intends to be a safe programming language that\n\
    excludes undefined behaviour, it provides its users with the escape hatch of\n\
    unsafe Rust, allowing them to circumvent some of its strong compile-time\nchecks.\
    \ This additional freedom has some advantages, including potentially more\nefficient\
    \ code, which is one of the main reasons why unsafe code is used\nextensively\
    \ throughout Rust's standard library. However, because unsafe code\nalso re-opens\
    \ the door to undefined behaviour, Amazon has convened a community\nto verify\
    \ the safety of the standard library, and in particular the unsafe code\ncontained\
    \ therein. Given that this effort is done in public, is open-sourced,\nand has\
    \ seen significant participation (from at least 50 different\ncontributors), we\
    \ have access to a wealth of information on how people are\nverifying the standard\
    \ library, as well as what is currently possible and what\nstill appears to be\
    \ beyond the state of the art for verified software.\n  In this paper, we discuss\
    \ the lessons learned thus far from this verification\neffort, from both our work\
    \ on it, as well as that of the broader community. In\nparticular, we start by\
    \ reviewing what has been accomplished thus far, as well\nas the main tools used\
    \ (specifically, their advantages and their limitations).\nWe then focus on some\
    \ of the remaining fundamental obstacles to verifying the\nstandard library, and\
    \ propose potential solutions to overcome them. We hope\nthat these observations\
    \ can guide future verification of not only the standard\nlibrary, but also unsafe\
    \ Rust code in general."
  tldr: '- Addresses the risk of undefined behavior in Rust''s standard library due
    to widespread use of unsafe code blocks that bypass compiler safety checks.

    - Uses community-driven verification with tools like Prusti and Miri to formally
    prove memory safety properties and detect potential vulnerabilities in unsafe
    code.

    - Matters because it directly impacts Rust''s foundational safety guarantees,
    where undetected bugs in standard library unsafe code could compromise entire
    applications relying on it.'
  ai_score: 9
  ai_reason: This paper directly addresses memory safety through verification of unsafe
    Rust code in the standard library, connecting to memory safety, type systems,
    program analysis, formal semantics, Rust language features, and sanitization techniques.
