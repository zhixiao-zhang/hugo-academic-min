    <div id="news" class="news">
      <div class="news-title"><span>📢 News:</span></div>
      {{ $items := .Site.Data.news.content | default (slice) }}
      {{ range (first 5 $items) }}
        <div class="news-content">
            {{ . | markdownify }}
        </div>
      {{ end }}
    </div>
